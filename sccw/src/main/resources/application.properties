spring.application.name=sccw

# Server Port
server.port=${PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Google GenAI Config
# spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT_ID:}
# spring.ai.google.genai.location=${GOOGLE_CLOUD_LOCATION:us-central1}
# spring.ai.google.genai.embedding.project-id=${GOOGLE_CLOUD_PROJECT_ID:}
# spring.ai.google.genai.embedding.location=${GOOGLE_CLOUD_LOCATION:us-central1}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-flash-latest
spring.ai.google.genai.embedding.options.model=gemini-embedding-2

# Vector store
spring.ai.vectorstore.mariadb.table-name=ai_vector_store
spring.ai.vectorstore.mariadb.initialize-schema=false

# Database (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sccw_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
